<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Hub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .hero { text-align: center; padding: 40px 20px; }
  .hero h1 { font-size: 36px; margin-bottom: 8px; }
  .hero p { color: #666; font-size: 16px; margin-bottom: 40px; }
  .btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-block; padding: 14px 40px; border-radius: 10px; font-size: 17px; font-weight: 600; text-decoration: none; cursor: pointer; min-width: 160px; }
  .btn-brand { background: #3451b2; color: #fff; }
  .btn-brand:hover { background: #2a4296; }
  .btn-alt { background: #fff; color: #3451b2; border: 2px solid #3451b2; }
  .btn-alt:hover { background: #f0f3ff; }
</style>
</head>
<body>
<div class="hero">
  <h1>Agent Hub</h1>
  <p>Agent 开发心得 — 上传 PDF，分享心得</p>
  <div class="btns">
    <a class="btn btn-brand" href="/upload.html">上传心得</a>
    <a class="btn btn-alt" href="/browse.html">查看心得</a>
  </div>
</div>
</body>
</html>
